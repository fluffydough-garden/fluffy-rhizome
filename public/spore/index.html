<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Invasion</title>
<meta name="description" content="Soft Invasion — a webzine that grows like a mycelium.">
<link rel="stylesheet" href="/spore/shared.css">
<style>
/* 한 화면짜리 대문: 모든 포자가 균사로 이어진 리좀. 스크롤은 페이지를 내리지 않고 확대·축소만 해요. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.hero{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hero.panning{cursor:grabbing}
#hy{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hero-title{position:absolute;z-index:2;left:var(--pad);right:var(--pad);top:50%;display:flex;flex-direction:column;pointer-events:none;transform-origin:50% 50%;
  font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(58px,14.6vw,290px);line-height:.92;letter-spacing:-.045em;will-change:transform,opacity}
.hero-title span:last-child{align-self:flex-end}
html.ko .hero-title{font-family:var(--f-ko-display);font-size:clamp(64px,15.5vw,300px);letter-spacing:-.04em;line-height:1}
#field{position:absolute;inset:0;z-index:3;pointer-events:none}
.sp{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);pointer-events:auto;border-radius:50%;will-change:transform}
.sp-body{display:block;width:100%;height:100%;animation:bob var(--d) ease-in-out var(--dl) infinite alternate;transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.sp:hover .sp-body,.sp:focus-visible .sp-body{transform:scale(1.14)}
.sp-body{filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
@keyframes bob{from{translate:0 -6px}to{translate:0 8px}}
.sp-lbl{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);width:max-content;max-width:220px;text-align:center;font-size:13px;line-height:1.35;opacity:0;transition:opacity .2s;pointer-events:none;
  background:rgba(14,15,21,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 10px;border-radius:12px}
.sp-lbl .mono{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}
.sp:hover .sp-lbl,.sp:focus-visible .sp-lbl,.hero.near .sp.big .sp-lbl{opacity:1}
.sp:hover,.sp:focus-visible{z-index:5}
.hero-foot{position:absolute;z-index:4;left:var(--pad);right:var(--pad);bottom:clamp(24px,5vh,56px);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:24px;pointer-events:none}
.hero-foot>*{pointer-events:auto}
.hero-meta{color:var(--ink-2)}
.zoom-cue{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-2);background:none;border:0;font:inherit;cursor:pointer}
.zoom-cue i{width:1px;height:38px;background:linear-gradient(var(--ink),transparent);animation:breath 2.4s ease-in-out infinite}
.zoom-cue b{font-weight:400;color:var(--muted)}
@keyframes breath{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.hero-sub{justify-self:end;max-width:300px;font-size:16px;line-height:1.45}
html.ko .hero-sub{font-family:var(--f-head);font-size:17px}
@media (max-width:720px){.hero-foot{grid-template-columns:1fr auto;justify-items:start}.hero-sub{display:none}}
/* the mother spore: the original Higgsfield model, turning slowly behind everything */
.mother{position:absolute;z-index:1;left:50%;top:47%;width:min(78vh,82vw);aspect-ratio:1;margin:calc(min(78vh,82vw) / -2) 0 0 calc(min(78vh,82vw) / -2);pointer-events:none;will-change:transform,opacity}
.mother-float{width:100%;height:100%;animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{transform:translateY(-10px) scale(.985)}to{transform:translateY(12px) scale(1.02)}}
.mother model-viewer{filter:drop-shadow(0 40px 70px rgba(0,0,0,.6)) saturate(1.05)}
.mother::before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,rgba(190,110,220,.28),rgba(60,80,170,0) 68%);filter:blur(30px);z-index:-1}
@media (max-width:720px){.mother{top:44%;width:min(96vw,60vh);margin:calc(min(96vw,60vh) / -2) 0 0 calc(min(96vw,60vh) / -2)}}
</style>
</head>
<body>
<header id="nav"></header>

<main>
  <section class="hero" id="top" aria-labelledby="hero-title">
    <canvas id="hy" aria-hidden="true"></canvas>
    <div class="mother" id="mother" aria-hidden="true"><div class="mother-float spore3d" id="mother-float"></div></div>
    <h1 class="hero-title" id="hero-title"></h1>
    <div id="field"></div>
    <div class="hero-foot">
      <p class="mono hero-meta" id="hero-meta"></p>
      <button type="button" class="zoom-cue mono" id="zoom-cue"><span id="zoom-txt"></span><b id="zoom-pct">100%</b><i aria-hidden="true"></i></button>
      <p class="hero-sub" id="hero-sub"></p>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/spore/shared.js"></script>
<script>
(() => {
"use strict";
const { t } = SP, { $, esc, rnd, clamp, hash, REDUCE } = SP.util;
const hero = $("#top"), cv = $("#hy"), g = cv.getContext("2d");

/* ---------- layout: a force-directed rhizome, fitted to one screen ---------- */
const TIER_PX = { 1: 64, 2: 84, 3: 106, 4: 136, 5: 164 };
let NODES = [], EDGES = [], TAGS = [], W = innerWidth, H = innerHeight;
function layout() {
  W = innerWidth; H = innerHeight;
  const posts = SP.posts, N = posts.length, R = rnd("rhizome" + N);
  const k = clamp(Math.sqrt(16 / Math.max(1, N)), .4, 1.1) * (W < 720 ? .68 : 1);
  NODES = posts.map(p => ({ id: p.id, p, s: Math.round(TIER_PX[p._tier] * k), x: (R() - .5) * W, y: (R() - .5) * H }));
  const by = new Map(NODES.map(n => [n.id, n]));
  // hyphae: links set in the admin (strong) + articles that share a tag (thin)
  EDGES = []; const seen = new Set();
  const add = (a, b, strong) => { const key = [a, b].sort().join("|"); if (a === b || seen.has(key) || !by.has(a) || !by.has(b)) return; seen.add(key); EDGES.push({ a: by.get(a), b: by.get(b), strong, bend: (hash(key) % 100 / 100 - .5) * .5, at: (hash(key) % 60) / 100 }); };
  SP.links.forEach(l => add(l.a, l.b, true));
  const tagMap = new Map();
  posts.forEach(p => p._concepts.forEach(c => { if (!tagMap.has(c)) tagMap.set(c, []); tagMap.get(c).push(p.id); }));
  TAGS = [];
  tagMap.forEach((ids, c) => { if (ids.length < 2) return; TAGS.push({ label: c, nodes: ids.map(i => by.get(i)) }); for (let i = 1; i < ids.length; i++) add(ids[i - 1], ids[i], false); });
  if (window.d3) {
    d3.forceSimulation(NODES)
      .force("link", d3.forceLink(EDGES.map(e => ({ source: e.a, target: e.b, strong: e.strong }))).distance(e => e.strong ? 150 : 220).strength(e => e.strong ? .5 : .12))
      .force("charge", d3.forceManyBody().strength(-260))
      .force("collide", d3.forceCollide(n => n.s * .62))
      .force("x", d3.forceX(0).strength(.05)).force("y", d3.forceY(0).strength(.07 * W / H))
      .stop().tick(320);
  }
  // fit into the screen, leaving room for the nav and the footer
  const xs = NODES.map(n => n.x), ys = NODES.map(n => n.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const bx = [W * .07, W * .93], byy = [H * .15, H * .8];
  NODES.forEach(n => {
    n.wx = bx[0] + (x1 > x0 ? (n.x - x0) / (x1 - x0) : .5) * (bx[1] - bx[0]);
    n.wy = byy[0] + (y1 > y0 ? (n.y - y0) / (y1 - y0) : .5) * (byy[1] - byy[0]);
  });
}

/* ---------- view: zoom (wheel / pinch / keys) and a little panning when zoomed in ---------- */
const Z_MIN = .75, Z_MAX = 5;
const view = { z: 1, x: 0, y: 0 }, goal = { z: 1, x: 0, y: 0 };
const sx = wx => (wx - W / 2) * view.z + W / 2 + view.x, sy = wy => (wy - H / 2) * view.z + H / 2 + view.y;
const sizeK = z => Math.pow(z, .72);          // spores grow slower than the distances between them, so zooming opens the rhizome up
function clampPan(v) { const m = Math.max(0, v.z - 1) * .62 + .08; v.x = clamp(v.x, -W * m, W * m); v.y = clamp(v.y, -H * m, H * m); }
function zoomAt(f, cx, cy) {
  const z = clamp(goal.z * f, Z_MIN, Z_MAX); if (z === goal.z) return;
  const wx = (cx - W / 2 - goal.x) / goal.z + W / 2, wy = (cy - H / 2 - goal.y) / goal.z + H / 2;   // keep the point under the cursor in place
  goal.z = z; goal.x = cx - W / 2 - (wx - W / 2) * z; goal.y = cy - H / 2 - (wy - H / 2) * z;
  clampPan(goal); kick();
}
const blocked = el => el && el.closest && el.closest("#reader,#about,#nav,.hero-foot");
addEventListener("wheel", e => {
  if (blocked(e.target)) return;
  e.preventDefault();
  const d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H : 1);
  zoomAt(Math.exp(-clamp(d, -240, 240) * (e.ctrlKey ? .01 : .0018)), e.clientX, e.clientY);
}, { passive: false });
addEventListener("keydown", e => {
  if (SP.readerId || /input|textarea/i.test(document.activeElement?.tagName || "")) return;
  if (e.key === "+" || e.key === "=") zoomAt(1.25, W / 2, H / 2);
  else if (e.key === "-" || e.key === "_") zoomAt(.8, W / 2, H / 2);
  else if (e.key === "0") reset();
});
function reset() { goal.z = 1; goal.x = 0; goal.y = 0; kick(); }
$("#zoom-cue").addEventListener("click", () => goal.z > 1.05 ? reset() : zoomAt(2, W / 2, H / 2));
hero.addEventListener("dblclick", e => { if (!e.target.closest(".sp")) reset(); });

// drag on empty space pans (spores and 3D models keep their own drag); two fingers pinch-zoom
const pts = new Map(); let pan = null, pinch = null;
const onEmpty = e => !e.target.closest(".sp,#nav,#reader,#about,.hero-foot") && !document.documentElement.classList.contains("spore-hot") && !document.documentElement.classList.contains("spore-drag");
hero.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; pan = null; return; }
  if (onEmpty(e)) { pan = { x: e.clientX, y: e.clientY, moved: 0 }; try { hero.setPointerCapture(e.pointerId); } catch {} }
});
hero.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomAt(d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch.d = d; return;
  }
  if (!pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y; pan.x = e.clientX; pan.y = e.clientY; pan.moved += Math.abs(dx) + Math.abs(dy);
  if (pan.moved > 4) hero.classList.add("panning");
  goal.x += dx; goal.y += dy; clampPan(goal); view.x = goal.x; view.y = goal.y; kick();
});
const endPt = e => {
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (pan && pan.moved > 5) { document.documentElement.dataset.justDragged = "1"; setTimeout(() => delete document.documentElement.dataset.justDragged, 0); }
  pan = null; hero.classList.remove("panning");
};
hero.addEventListener("pointerup", endPt); hero.addEventListener("pointercancel", endPt);

/* ---------- drawing ---------- */
let raf = 0, grow = REDUCE ? 1 : 0, t0 = 0, commitT = 0, committed = 1;
function kick() { if (!raf) raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = 0;
  const e = REDUCE ? 1 : .2;
  view.z += (goal.z - view.z) * e; view.x += (goal.x - view.x) * e; view.y += (goal.y - view.y) * e;
  if (Math.abs(goal.z - view.z) < .0005 && Math.abs(goal.x - view.x) < .1 && Math.abs(goal.y - view.y) < .1) Object.assign(view, goal);
  if (!t0) t0 = now; grow = REDUCE ? 1 : clamp((now - t0) / 2600, 0, 1);
  draw(now);
  const moving = view.z !== goal.z || view.x !== goal.x || view.y !== goal.y || grow < 1;
  // after the zoom settles, give the spores their real size (sharp 3D) instead of a stretched picture
  if (!moving && Math.abs(committed - sizeK(view.z)) > .02) { clearTimeout(commitT); commitT = setTimeout(commit, 180); }
  if (moving) kick();
}
function commit() {
  committed = sizeK(view.z);
  NODES.forEach(n => n.el && n.el.style.setProperty("--s", Math.round(n.s * committed) + "px"));
  draw(performance.now());
}
function draw() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const z = view.z, k = sizeK(z) / committed;
  // spores
  NODES.forEach(n => { if (n.el) n.el.style.transform = `translate3d(${sx(n.wx).toFixed(1)}px,${sy(n.wy).toFixed(1)}px,0) scale(${k.toFixed(4)})`; });
  hero.classList.toggle("near", z > 2.2);
  // hyphae
  g.lineCap = "round";
  EDGES.forEach(ed => {
    const d = clamp(grow * 1.6 - ed.at, 0, 1); if (!d) return;
    const ax = sx(ed.a.wx), ay = sy(ed.a.wy), bx = sx(ed.b.wx), by = sy(ed.b.wy);
    const mx = (ax + bx) / 2 - (by - ay) * ed.bend, my = (ay + by) / 2 + (bx - ax) * ed.bend;
    g.strokeStyle = ed.strong ? "rgba(201,139,255,.62)" : `rgba(225,228,240,${(.13 + Math.min(.12, (z - 1) * .05)).toFixed(3)})`;
    g.lineWidth = (ed.strong ? 1.3 : .8) * Math.min(1.8, Math.sqrt(z));
    g.beginPath(); g.moveTo(ax, ay);
    if (d >= 1) g.quadraticCurveTo(mx, my, bx, by);
    else { const N = 24; for (let i = 1; i <= N * d; i++) { const u = i / N; g.lineTo((1 - u) * (1 - u) * ax + 2 * (1 - u) * u * mx + u * u * bx, (1 - u) * (1 - u) * ay + 2 * (1 - u) * u * my + u * u * by); } }
    g.stroke();
  });
  // concept names surface as you zoom in
  const la = clamp((z - 1.35) / .8, 0, 1) * grow;
  if (la > .01) {
    g.font = `${Math.round(10 + Math.min(4, z))}px "Space Mono", monospace`; g.textAlign = "center";
    TAGS.forEach(tg => {
      const cx = tg.nodes.reduce((s, n) => s + n.wx, 0) / tg.nodes.length, cy = tg.nodes.reduce((s, n) => s + n.wy, 0) / tg.nodes.length;
      const x = sx(cx), y = sy(cy) + 4 + (hash(tg.label) % 30 - 15);
      if (x < -80 || x > W + 80 || y < -20 || y > H + 20) return;
      g.fillStyle = `rgba(238,240,247,${(.62 * la).toFixed(3)})`; g.fillText("#" + tg.label.toUpperCase(), x, y);
      g.fillStyle = `rgba(201,139,255,${(.8 * la).toFixed(3)})`; g.beginPath(); g.arc(x, y - 14, 2, 0, 6.29); g.fill();
    });
  }
  // the title and the mother spore stay behind: they drift less and fade as you go in
  const tk = Math.pow(z, .35);
  $("#hero-title").style.transform = `translate3d(${(view.x * .35).toFixed(1)}px,calc(-54% + ${(view.y * .35).toFixed(1)}px),0) scale(${tk.toFixed(4)})`;
  $("#hero-title").style.opacity = clamp(1.55 - z * .55, .06, 1).toFixed(3);
  $("#mother").style.transform = `translate3d(${(view.x * .25).toFixed(1)}px,${(view.y * .25).toFixed(1)}px,0) scale(${Math.pow(z, .3).toFixed(4)})`;
  $("#mother").style.opacity = clamp(1.4 - z * .4, .25, 1).toFixed(3);
  $("#zoom-pct").textContent = Math.round(z * 100) + "%";
}

/* ---------- spores ---------- */
function renderHero() {
  const posts = SP.posts, N = posts.length;
  $("#hero-title").innerHTML = t("title").map(l => `<span>${esc(l)}</span>`).join("");
  $("#hero-sub").textContent = t("subtitle");
  $("#hero-meta").textContent = `${N} ${t("spores")} · ${EDGES.length} ${t("hyphae")}`;
  $("#zoom-txt").textContent = t("scroll");
  const R = rnd("bob" + N);
  committed = sizeK(view.z);
  $("#field").innerHTML = NODES.map(n => `<button class="sp${n.p._tier >= 4 ? " big" : ""}" data-read="${esc(n.id)}" aria-label="${esc(SP.titleOf(n.p))}"
      style="--s:${Math.round(n.s * committed)}px;--d:${(4 + R() * 4).toFixed(2)}s;--dl:${(-R() * 6).toFixed(2)}s">
      <span class="sp-body">${SP.sporeImg(n.p, "", true)}</span><span class="sp-lbl"><span class="mono">${esc(t("article"))} / ${SP.no(n.p)}</span>${esc(SP.titleOf(n.p))}</span></button>`).join("");
  const els = new Map([...$("#field").children].map(el => [el.dataset.read, el]));
  NODES.forEach(n => { n.el = els.get(n.id); });
  draw(); kick();
}

/* the mother spore: the original Higgsfield model (spin version), behind everything */
SP.spore3d($("#mother-float"), { src: "/spore/media/spore-spin.glb", mobileSrc: "/spore/media/spore-mobile.glb", eager: true, speed: 14 });

/* ---------- reader ↔ address (#p=글ID), so links can be shared and Back closes it ---------- */
SP.read = id => { if (location.hash !== "#p=" + encodeURIComponent(id)) history.pushState(null, "", "#p=" + encodeURIComponent(id)); SP.openReader(id); };
SP.unread = () => { if (location.hash.startsWith("#p=")) history.pushState(null, "", location.pathname + location.search); SP.closeReader(); };
function fromHash() { const m = location.hash.match(/^#p=(.+)$/); if (m) SP.openReader(decodeURIComponent(m[1])); else SP.closeReader(); }
addEventListener("popstate", fromHash); addEventListener("hashchange", fromHash);
document.addEventListener("keydown", e => { if (e.key === "Escape" && SP.readerId) SP.unread(); });

function renderAll() { document.title = t("titleFlat"); SP.renderNav("spores"); renderHero(); }
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { layout(); renderHero(); }, 150); });
SP.onLang(renderAll);
SP.onData(() => { layout(); renderAll(); });
SP.renderNav("spores");
SP.ready.then(() => { layout(); renderAll(); fromHash(); });
})();
</script>
</body>
</html>
