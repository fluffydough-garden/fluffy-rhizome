<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Invasion</title>
<meta name="description" content="Soft Invasion — a webzine that grows like a mycelium.">
<link rel="stylesheet" href="/spore/shared.css">
<style>
/* ---------- 1. hero: every spore at once ---------- */
.hero{position:relative;height:100vh;min-height:620px;overflow:hidden}
.field{position:absolute;inset:0;pointer-events:none;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.field.back{z-index:1}.field.front{z-index:3}
.hero-title{position:absolute;z-index:2;left:var(--pad);right:var(--pad);top:50%;transform:translateY(-54%);display:flex;flex-direction:column;pointer-events:none;
  font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(58px,14.6vw,290px);line-height:.92;letter-spacing:-.045em}
.hero-title span:last-child{align-self:flex-end}
html.ko .hero-title{font-family:var(--f-ko-display);font-size:clamp(64px,15.5vw,300px);letter-spacing:-.04em;line-height:1}
.sp{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);pointer-events:auto;border-radius:50%}
.sp-body{display:block;width:100%;height:100%;animation:bob var(--d) ease-in-out var(--dl) infinite alternate;transform:rotate(var(--r));transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.sp:hover .sp-body,.sp:focus-visible .sp-body{transform:rotate(var(--r)) scale(1.18)}
.field.front .sp-body{filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.field.back .sp-body{opacity:.92}
@keyframes bob{from{translate:0 -8px}to{translate:0 10px}}
.sp-lbl{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);width:max-content;max-width:220px;text-align:center;font-size:13px;line-height:1.35;opacity:0;transition:opacity .2s;pointer-events:none;
  background:rgba(14,15,21,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 10px;border-radius:12px}
.sp-lbl .mono{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}
.sp:hover .sp-lbl,.sp:focus-visible .sp-lbl{opacity:1}
.sp:hover,.sp:focus-visible{z-index:5}
.hero-foot{position:absolute;z-index:4;left:var(--pad);right:var(--pad);bottom:clamp(24px,5vh,56px);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:24px;pointer-events:none}
.hero-foot>*{pointer-events:auto}
.hero-meta{color:var(--ink-2)}
.scroll-cue{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink-2)}
.scroll-cue i{width:1px;height:38px;background:linear-gradient(var(--ink),transparent);animation:drip 2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.hero-sub{justify-self:end;max-width:300px;font-size:16px;line-height:1.45}
html.ko .hero-sub{font-family:var(--f-head);font-size:17px}
@media (max-width:720px){.hero-foot{grid-template-columns:1fr;justify-items:start}.scroll-cue{display:none}.hero-sub{justify-self:start}}
/* the mother spore: a 3D model (Higgsfield · Meshy) turning slowly behind the title */
.mother{position:absolute;z-index:1;left:50%;top:47%;width:min(78vh,82vw);aspect-ratio:1;translate:-50% -50%;pointer-events:none}
.mother-float{width:100%;height:100%;animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{transform:translateY(-10px) scale(.985)}to{transform:translateY(12px) scale(1.02)}}
.mother model-viewer{filter:drop-shadow(0 40px 70px rgba(0,0,0,.6)) saturate(1.05)}
/* the other three: specimens (green-shifted), rhizome preview (blue-shifted, the quad mesh), end of the archive (small) */
.s3d{position:absolute;z-index:0;aspect-ratio:1}
.s3d-float{width:100%;height:100%;animation:breathe 11s ease-in-out infinite alternate}
#specimens>.s3d{right:-4vw;top:clamp(160px,24vh,280px);width:min(38vw,460px)}
#rhizome>.s3d{left:-5vw;top:clamp(40px,8vh,100px);width:min(30vw,380px)}
.s3d-end{position:relative;width:min(240px,50vw);aspect-ratio:1;margin:24px auto -8px}
.s3d-end .s3d-float{animation-duration:7s}
#specimens>*:not(.s3d),#rhizome>*:not(.s3d){position:relative;z-index:1}
#rhizome .pv-title{position:absolute}
@media (max-width:820px){#specimens>.s3d{width:52vw;right:-14vw;top:120px}#rhizome>.s3d{width:44vw;left:-12vw}}
.mother::before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,rgba(190,110,220,.28),rgba(60,80,170,0) 68%);filter:blur(30px);z-index:-1}
@media (max-width:720px){.mother{top:44%;width:min(96vw,60vh)}}

/* ---------- shared section bits ---------- */
.sec{position:relative;padding:clamp(80px,14vh,160px) var(--pad) 40px}
.big{font-family:var(--f-display);text-transform:uppercase;font-size:clamp(52px,10vw,180px);line-height:.9;letter-spacing:-.045em}
html.ko .big{font-family:var(--f-ko-display);letter-spacing:-.04em;line-height:1}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--rule)}
.lead{max-width:420px;font-size:16px;line-height:1.5;color:var(--ink-2)}

/* ---------- 2. specimens: which spore is which ---------- */
.spec-row{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:32px;padding:28px 0;border-bottom:1px solid var(--rule);align-items:start}
.spec-key{display:flex;gap:18px;align-items:flex-start}
.spec-key .swatch{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:inset -6px -8px 14px rgba(0,0,0,.35),inset 6px 6px 12px rgba(255,255,255,.35)}
.spec-key h3{font-family:var(--f-head);font-size:20px;line-height:1.3}
.spec-key p{color:var(--muted);margin-top:4px;font-size:14px}
.spec-key .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:10px}
.spec-spores{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;min-height:58px}
.spec-spores .empty{color:var(--faint);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;align-self:center}
.mini-sp{position:relative;width:96px;height:96px;border-radius:50%}
.mini-sp .spore-img{transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
.mini-sp:hover .spore-img,.mini-sp:focus-visible .spore-img{transform:scale(1.15)}
.mini-sp.second{opacity:.5}
.mini-sp.second::after{content:attr(data-sec);position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mini-sp .sp-lbl{top:88%}
.mini-sp:hover .sp-lbl,.mini-sp:focus-visible .sp-lbl{opacity:1}
.mini-sp:hover,.mini-sp:focus-visible{z-index:5;opacity:1}
@media (max-width:820px){.spec-row{grid-template-columns:1fr;gap:16px}.mini-sp{width:76px;height:76px}}

/* ---------- 3. rhizome preview ---------- */
.preview{padding-top:clamp(60px,10vh,120px)}
.pv-title{position:absolute;left:var(--pad);right:var(--pad);top:clamp(60px,10vh,120px);z-index:0;text-align:center;font-size:clamp(64px,17vw,330px);pointer-events:none}
.stage{position:relative;z-index:1;display:block;height:min(78vh,780px);margin-top:clamp(20px,6vh,80px)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.pv-foot{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:end;margin-top:-40px}
.pv-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-tags .tag:first-child{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pv-note{justify-self:end;max-width:380px}
.pv-note h3{font-family:var(--f-head);font-size:18px;margin-bottom:8px}
.pv-note p{color:var(--ink-2)}
@media (max-width:820px){.pv-foot{grid-template-columns:1fr;justify-items:start;margin-top:0}.pv-note{justify-self:start}}

/* ---------- 4. archive: endless list ---------- */
.list-item{border-bottom:1px solid var(--rule)}
.li{display:grid;grid-template-columns:minmax(220px,34%) 1fr 120px;gap:clamp(20px,3vw,52px);width:100%;padding:34px 0;align-items:stretch}
.li-media{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:2px;background:var(--paper-2)}
.li-media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.li-media.art{background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--tint) 30%,#1a1b24),#0c0d12 78%)}
.li-media.art .spore-img{position:absolute;inset:8%;width:84%;height:84%}
.li:hover .li-media>img{transform:scale(1.04)}
.li-text{display:flex;flex-direction:column;gap:12px;min-width:0}
.li-text h3{font-family:var(--f-head);font-size:clamp(22px,2.3vw,34px);line-height:1.2;max-width:30ch}
.li:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.li-sum{color:var(--ink-2);max-width:60ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.li-meta{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.li-meta b{font-family:var(--f-head);font-weight:500}
.li-meta .tag{height:24px;font-size:12px}
.li-spore{width:120px;height:120px;align-self:start}
#list-end{padding:48px 0 16px;text-align:center;color:var(--muted)}
#sentinel{height:1px}
@media (max-width:820px){.li{grid-template-columns:1fr;gap:16px}.li-spore{display:none}}

.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:40px var(--pad) 48px;color:var(--muted)}
</style>
</head>
<body>
<header id="nav"></header>

<main>
  <section class="hero" id="top" aria-labelledby="hero-title">
    <div class="field back" id="field-back"></div>
    <div class="mother" id="mother" aria-hidden="true"><div class="mother-float spore3d" id="mother-float"></div></div>
    <h1 class="hero-title" id="hero-title"></h1>
    <div class="field front" id="field-front"></div>
    <div class="hero-foot">
      <p class="mono hero-meta" id="hero-meta"></p>
      <a class="scroll-cue mono" href="#specimens"><span id="scroll-txt"></span><i aria-hidden="true"></i></a>
      <p class="hero-sub" id="hero-sub"></p>
    </div>
  </section>

  <section class="sec" id="specimens" aria-labelledby="spec-title">
    <div class="s3d" aria-hidden="true"><div class="s3d-float spore3d" id="s3d-spec"></div></div>
    <div class="sec-head"><h2 class="big" id="spec-title"></h2><p class="lead" id="spec-lead"></p></div>
    <div id="spec-rows"></div>
  </section>

  <section class="sec preview" id="rhizome" aria-labelledby="pv-title">
    <div class="s3d" aria-hidden="true"><div class="s3d-float spore3d" id="s3d-rhizome"></div></div>
    <h2 class="big pv-title" id="pv-title"></h2>
    <a class="stage" id="stage" data-spore-through href="/spore/rhizome/" aria-label="Rhizome"><canvas id="pv"></canvas></a>
    <div class="pv-foot">
      <div class="pv-tags" id="pv-tags"></div>
      <a class="pill-btn dark" id="pv-go" href="/spore/rhizome/"></a>
      <div class="pv-note"><h3 id="pv-note-h"></h3><p id="pv-note"></p></div>
    </div>
  </section>

  <section class="sec" id="archive" aria-labelledby="ar-title">
    <div class="sec-head"><h2 class="big" id="ar-title"></h2><span class="tag" id="ar-count"></span></div>
    <div id="list"></div>
    <div id="sentinel" aria-hidden="true"></div>
    <div class="s3d-end" aria-hidden="true"><div class="s3d-float spore3d" id="s3d-end"></div></div>
    <p id="list-end" class="mono"></p>
  </section>
</main>
<footer class="foot mono"><span id="foot-l"></span><a href="#top">↑ Top</a></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/spore/shared.js"></script>
<script>
(() => {
"use strict";
const { t, TOPICS } = SP, { $, esc, rnd, clamp, fmtDate, hash, REDUCE } = SP.util;

/* ---------- 1. hero ---------- */
const TIER_PX = { 1: 70, 2: 92, 3: 116, 4: 142, 5: 172 };
function renderHero() {
  const posts = SP.posts, N = posts.length;
  $("#hero-title").innerHTML = t("title").map(l => `<span>${esc(l)}</span>`).join("");
  $("#hero-sub").textContent = t("subtitle");
  $("#hero-meta").textContent = `${N} ${t("spores")} · ${SP.links.length + posts.reduce((n, p) => n + p._concepts.length, 0)} ${t("hyphae")}`;
  $("#scroll-txt").textContent = t("scroll");
  // spread every spore over the screen: best-candidate sampling keeps them apart, seeded so they stay put
  const k = clamp(Math.sqrt(16 / Math.max(1, N)), .38, 1.1) * (innerWidth < 720 ? .7 : 1);
  const placed = [], R = rnd("hero" + N);
  const order = [...posts].sort((a, b) => b._tier - a._tier || a._no - b._no);
  const out = { back: "", front: "" };
  order.forEach(p => {
    let best = null, bd = -1;
    for (let i = 0; i < 24; i++) {
      const x = .05 + R() * .9, y = .13 + R() * .72;
      const d = placed.reduce((m, q) => Math.min(m, Math.hypot((x - q[0]) * 1.6, y - q[1])), 9);
      if (d > bd) { bd = d; best = [x, y]; }
    }
    placed.push(best);
    const front = hash(p.id) % 5 < 2, s = Math.round(TIER_PX[p._tier] * k);
    const el = `<button class="sp" data-read="${esc(p.id)}" aria-label="${esc(SP.titleOf(p))}"
      style="left:${(best[0] * 100).toFixed(2)}%;top:${(best[1] * 100).toFixed(2)}%;--s:${s}px;--d:${(4 + R() * 4).toFixed(2)}s;--dl:${(-R() * 6).toFixed(2)}s;--r:${((R() - .5) * 30).toFixed(1)}deg">
      <span class="sp-body">${SP.sporeImg(p)}</span><span class="sp-lbl"><span class="mono">${esc(t("article"))} / ${SP.no(p)}</span>${esc(SP.titleOf(p))}</span></button>`;
    out[front ? "front" : "back"] += el;
  });
  $("#field-back").innerHTML = out.back; $("#field-front").innerHTML = out.front;
}
// a little depth: the two layers drift apart with the pointer
if (!REDUCE) addEventListener("pointermove", e => {
  if (scrollY > innerHeight) return;
  const dx = e.clientX / innerWidth - .5, dy = e.clientY / innerHeight - .5;
  $("#field-back").style.transform = `translate(${dx * -10}px,${dy * -8}px)`;
  $("#field-front").style.transform = `translate(${dx * 22}px,${dy * 16}px)`;
}, { passive: true });

/* 3D spores (Higgsfield · Meshy): the mother spore behind the title, and three more drifting through the page.
   They turn on their own, stop under the pointer, and can be dragged round — see SP.spore3d in shared.js. */
const M = "/spore/media/";
SP.spore3d($("#mother-float"), { src: M + "spore-spin.glb", mobileSrc: M + "spore-mobile.glb", eager: true, speed: 14 });
SP.spore3d($("#s3d-spec"), { src: M + "spore-still.glb", mobileSrc: M + "spore-mobile.glb", hue: 105, speed: 20, theta: 120, tilt: 66 });
SP.spore3d($("#s3d-rhizome"), { src: M + "spore-quad.glb", mobileSrc: M + "spore-mobile.glb", hue: 205, speed: 11, theta: 250, tilt: 92 });
SP.spore3d($("#s3d-end"), { src: M + "spore-mobile.glb", hue: -35, speed: 26, theta: 40, tilt: 72 });

/* ---------- 2. specimens ---------- */
function renderSpecimens() {
  $("#spec-title").textContent = t("specimensTitle"); $("#spec-lead").textContent = t("specimensLead");
  const keys = Object.keys(TOPICS).filter(k => k !== "unclassified" || SP.posts.some(p => p._topic === "unclassified"));
  $("#spec-rows").innerHTML = keys.map(k => {
    const [name, desc] = SP.topicText(k), main = SP.posts.filter(p => p._topic === k), sec = SP.posts.filter(p => p._topic2 === k);
    const spore = (p, second) => `<button class="mini-sp${second ? " second" : ""}" data-read="${esc(p.id)}" ${second ? `data-sec="${esc(t("secondary"))}"` : ""} aria-label="${esc(SP.titleOf(p))}">${SP.sporeImg(p)}<span class="sp-lbl"><span class="mono">${esc(t("article"))} / ${SP.no(p)}</span>${esc(SP.titleOf(p))}</span></button>`;
    return `<div class="spec-row">
      <div class="spec-key"><span class="swatch" style="background:radial-gradient(circle at 35% 30%,${TOPICS[k].tint},${TOPICS[k].color} 70%)"></span>
        <div><h3>${esc(name)}</h3><p>${esc(desc)}</p><p class="n">${main.length} ${esc(t("spores"))}</p></div></div>
      <div class="spec-spores">${main.map(p => spore(p)).join("")}${sec.map(p => spore(p, true)).join("")}${main.length + sec.length ? "" : `<span class="empty">${esc(t("noneYet"))}</span>`}</div>
    </div>`;
  }).join("");
}

/* ---------- 3. rhizome preview ---------- */
let G = null, pvGrow = REDUCE ? 1 : 0, pvStarted = false;
const pv = $("#pv"), pctx = pv.getContext("2d"), imgs = new Map();
function renderPreviewText() {
  $("#pv-title").textContent = t("rhizomeTitle");
  $("#pv-tags").innerHTML = t("rhizomeTags").map(x => `<span class="tag">${esc(x)}</span>`).join("");
  $("#pv-go").innerHTML = `${esc(t("enterRhizome"))} <span aria-hidden="true">→</span>`;
  $("#pv-note-h").textContent = t("mycelium"); $("#pv-note").textContent = t("rhizomeLead");
  $("#stage").setAttribute("aria-label", t("enterRhizome"));
}
function sporeFor(p) {
  if (p.spore && p.spore.image) {
    if (!imgs.has(p.id)) { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = drawPreview; im.src = p.spore.image; imgs.set(p.id, im); }
    const im = imgs.get(p.id); if (im.complete && im.naturalWidth) return im;
  }
  return SP.sporeCanvas(p, 128);
}
function drawPreview() {
  if (!G) return;
  const W = pv.clientWidth, H = pv.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
  if (pv.width !== W * dpr) { pv.width = W * dpr; pv.height = H * dpr; }
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0); pctx.clearRect(0, 0, W, H);
  if (!G.nodes.length) return;
  const xs = G.nodes.map(n => n.x), ys = G.nodes.map(n => n.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const k = Math.min(W / (x1 - x0 + 160), H / (y1 - y0 + 160)), ox = W / 2 - k * (x0 + x1) / 2, oy = H / 2 - k * (y0 + y1) / 2;
  pctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  pctx.lineCap = "round"; pctx.lineJoin = "round";
  const poly = (pts, g) => { const n = pts.length - 1, f = clamp(g, 0, 1) * n, last = Math.floor(f); if (f <= 0) return; pctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i <= last; i++) pctx.lineTo(pts[i][0], pts[i][1]); if (last < n) { const r = f - last, a = pts[last], b = pts[last + 1]; pctx.lineTo(a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r); } };
  const g = pvGrow;
  pctx.strokeStyle = `rgba(225,228,240,${.16})`; pctx.lineWidth = .7 / k;
  pctx.beginPath(); G.nodes.forEach(n => n.fil.forEach(f => poly(f, clamp(g * 1.6, 0, 1)))); pctx.stroke();
  G.edges.forEach((e, i) => {
    const d = clamp(g * 1.5 - (hash(e.k) % 50) / 100, 0, 1); if (!d) return;
    const from = G.byId.get(e.a).type === "p" ? e.pts : [...e.pts].reverse();
    pctx.strokeStyle = e.kind === "pp" ? "rgba(201,139,255,.7)" : "rgba(225,228,240,.38)"; pctx.lineWidth = (e.kind === "pp" ? 1.3 : .8) / Math.sqrt(k);
    pctx.beginPath(); poly(from, d); e.br.forEach(b => { if (d > b.at) poly(b.pts, (d - b.at) * 2); }); pctx.stroke();
  });
  G.nodes.forEach(n => {
    if (n.type === "c") { pctx.fillStyle = "rgba(238,240,247,.8)"; pctx.beginPath(); pctx.arc(n.x, n.y, (n.major ? 3.4 : 2) / Math.sqrt(k), 0, 6.29); pctx.fill(); return; }
    const s = (26 + n.tier * 9) * clamp(g * 1.3, 0, 1) / Math.sqrt(k);
    if (s > 1) pctx.drawImage(sporeFor(n.post), n.x - s, n.y - s, s * 2, s * 2);
  });
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.font = `11px "Space Mono", monospace`; pctx.fillStyle = `rgba(238,240,247,${.7 * clamp(g * 2 - 1, 0, 1)})`;
  G.nodes.forEach(n => { if (n.type === "c" && n.major) pctx.fillText(n.label.toUpperCase(), ox + k * n.x + 8, oy + k * n.y + 4); });
}
function startGrow() {
  if (pvStarted) return; pvStarted = true;
  if (REDUCE) { pvGrow = 1; drawPreview(); return; }
  const t0 = performance.now();
  const step = now => { pvGrow = clamp((now - t0) / 2600, 0, 1); drawPreview(); if (pvGrow < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) startGrow(); }), { threshold: .25 }).observe($("#stage"));
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawPreview(); renderHero(); }, 150); });

/* ---------- 4. archive: loads more as you reach the bottom ---------- */
const BATCH = 6; let shownN = 0, sorted = [];
function item(p) {
  const tp = SP.topicText(p._topic), c = SP.catOf(p);
  const media = p.image ? `<div class="li-media"><img src="${esc(p.image)}" alt="${esc(p.imageAlt || "")}" loading="lazy"></div>`
    : `<div class="li-media art" style="--tint:${TOPICS[p._topic].tint}">${SP.sporeImg(p)}</div>`;
  return `<article class="list-item"><button class="li" data-read="${esc(p.id)}">
    ${media}
    <div class="li-text"><span class="mono muted">${esc(t("article"))} / ${SP.no(p)}</span><h3>${esc(SP.titleOf(p))}</h3>${SP.summaryOf(p) ? `<p class="li-sum">${esc(SP.summaryOf(p))}</p>` : ""}
      <p class="li-meta"><i class="dot" style="background:${TOPICS[p._topic].color}"></i>${c || p._topic !== "unclassified" ? `<b>${esc(c ? SP.catName(c) : tp[0])}</b>` : ""}${p.date ? `<span>•</span><span>${esc(fmtDate(p.date))}</span>` : ""}${(p.tags || []).slice(0, 3).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</p></div>
    <div class="li-spore">${SP.sporeImg(p)}</div>
  </button></article>`;
}
function resetArchive() {
  $("#ar-title").textContent = t("archiveTitle"); $("#ar-count").textContent = t("archiveCount")(SP.posts.length);
  sorted = [...SP.posts].sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")) || b._no - a._no);
  const keep = Math.max(BATCH, shownN); shownN = 0; $("#list").innerHTML = ""; more(keep);
}
function more(n = BATCH) {
  const next = sorted.slice(shownN, shownN + n); shownN += next.length;
  $("#list").insertAdjacentHTML("beforeend", next.map(item).join(""));
  $("#list-end").textContent = shownN >= sorted.length ? `— ${t("archiveEnd")} —` : "";
}
new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && shownN < sorted.length) more(); }), { rootMargin: "800px 0px" }).observe($("#sentinel"));

/* ---------- reader ↔ address (#p=글ID), so links can be shared and Back closes it ---------- */
SP.read = id => { if (location.hash !== "#p=" + encodeURIComponent(id)) history.pushState(null, "", "#p=" + encodeURIComponent(id)); SP.openReader(id); };
SP.unread = () => { if (location.hash.startsWith("#p=")) history.pushState(null, "", location.pathname + location.search); SP.closeReader(); };
function fromHash() { const m = location.hash.match(/^#p=(.+)$/); if (m) SP.openReader(decodeURIComponent(m[1])); else SP.closeReader(); }
addEventListener("popstate", fromHash); addEventListener("hashchange", fromHash);
document.addEventListener("keydown", e => { if (e.key === "Escape" && SP.readerId) SP.unread(); });

function renderAll() {
  document.title = t("titleFlat");
  SP.renderNav("spores"); renderHero(); renderSpecimens(); renderPreviewText(); resetArchive();
  $("#foot-l").textContent = `${t("titleFlat")} — ${t("subtitle")}`;
}
SP.onLang(() => { renderAll(); drawPreview(); });
SP.onData(() => { G = SP.network(); renderAll(); drawPreview(); });
SP.renderNav("spores");
SP.ready.then(() => { G = SP.network(); renderAll(); drawPreview(); fromHash(); });
})();
</script>
</body>
