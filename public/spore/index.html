<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhizome · Soft Invasion</title>
<link rel="stylesheet" href="/spore/shared.css">
<style>


:root{
  /* MYCELIUM ARCHIVE — dark version: pale hyphae on a dark substrate, violet when a spore is chosen, coral for the path you walked */
  --substrate:#07080c; --substrate-2:#0d0e15;
  --hypha:225,228,240;
  --spore:#c98bff; --spore-rgb:201,139,255;
  --trace:#ff8a5c; --trace-rgb:255,138,92;
  --ink:#eef0f7; --muted:rgba(238,240,247,.6); --faint:rgba(238,240,247,.32);
  --paper:#12131a; --paper-2:#1c1e28; --paper-ink:#eef0f7; --paper-muted:#8a90a5; --link:#d2a8ff;
  --colony-1:201,139,255; --colony-2:90,150,255; --colony-3:255,138,92;
  --f-display:"Space Mono","Kig Display",ui-monospace,monospace;
  --f-head:"Kig Head","Space Mono","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-body:"Kig Body","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"Space Mono","Kig Body",ui-monospace,monospace;
  --pw:min(560px,100vw);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--substrate);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;font-synthesis:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
:focus-visible{outline:1.5px solid var(--spore);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- the dish ---------- */
#substrate{position:fixed;inset:0;z-index:0;background:radial-gradient(45% 40% at 62% 12%,rgba(92,52,120,.3),transparent 70%),radial-gradient(40% 50% at 15% 85%,rgba(40,62,130,.28),transparent 70%),var(--substrate)}
#substrate video,#substrate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;mix-blend-mode:screen}
#substrate::after{content:"";position:absolute;inset:0;opacity:0;background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .9px);background-size:3px 3px}
#dish{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
#dish:active{cursor:grabbing}
#dish canvas{position:absolute;inset:0;width:100%;height:100%}
#spores{pointer-events:none;z-index:3}
#labels{position:absolute;inset:0;z-index:4;pointer-events:none}

/* concepts: spore-dots with a name */
.cn{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;transform-origin:0 50%;white-space:nowrap;text-shadow:0 0 5px var(--substrate),0 0 2px var(--substrate);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:color .3s,opacity .3s}
.cn::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(var(--hypha),.06);flex:none;margin-left:-3.5px;transition:box-shadow .3s,background .3s}
.cn.major{font-size:12.5px;color:var(--ink)}
.cn.minor{opacity:.55}
.cn.minor.hidden{opacity:0!important;pointer-events:none}
.cn:hover,.cn.near,.cn.far{color:var(--ink);opacity:1}
.cn.focus{color:var(--spore);opacity:1}
.cn.focus::before{box-shadow:0 0 0 5px rgba(var(--spore-rgb),.18),0 0 18px 4px rgba(var(--spore-rgb),.45)}
.cn .n{color:var(--faint);letter-spacing:0}
.cn.focus .n{color:rgba(var(--spore-rgb),.6)}

/* posts: fruiting bodies. A small cap + a truncated title; hover/focus makes it grow into a card */
.fb{position:absolute;left:0;top:0;pointer-events:auto;transition:opacity .35s}
.fb{--cs:14px}
.fb .cap{position:absolute;left:calc(var(--cs) / -2);top:calc(var(--cs) / -2);width:var(--cs);height:var(--cs);border-radius:50%;background:var(--art) center/contain no-repeat;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));scale:var(--zk,1);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s}
/* 4~5단계 글: 3D 포자(Higgsfield)가 지도 위에서 직접 돌아요. 3D엔 필터를 걸지 않아요(매 프레임 다시 그려서 버벅임) */
.fb.has-3d .cap{background:none;border-radius:0;filter:none!important}
.fb.has-3d .cap .s3p{width:100%;height:100%}
.fb.has-3d:hover .cap,.fb.has-3d.near .cap,.fb.has-3d.focus .cap{transform:scale(1.12)}
.fb .t{position:absolute;left:calc(var(--cs) * var(--zk,1) / 2 + 6px);top:-9px;max-width:180px;font-family:var(--f-head);font-size:12.5px;line-height:1.35;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px var(--substrate),0 0 3px var(--substrate),0 0 1px var(--substrate);transition:opacity .2s}
.fb .card{position:absolute;left:calc(var(--cs) * var(--zk,1) / 2 + 6px);bottom:-12px;width:280px;padding:14px 16px 16px;background:var(--paper);color:var(--paper-ink);border-radius:2px 18px 18px 18px;
  transform-origin:0 100%;transform:scale(.3);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.25,1.15),opacity .2s;box-shadow:0 24px 50px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);z-index:2}
.fb .card .mono{color:var(--paper-muted);font-size:10px}
.fb .card h3{font-family:var(--f-display);font-size:19px;line-height:1.2;margin:6px 0 8px}
.fb .card p{font-size:13px;line-height:1.6;color:#c3c7d6}
.fb .card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;margin:-14px -16px 12px;width:calc(100% + 32px);border-radius:2px 18px 0 0;filter:saturate(.75)}
.fb .card .more{margin-top:10px;color:var(--link)}
.fb:hover,.fb:focus-within,.fb.peek{z-index:10}
.fb:hover .card,.fb:focus-within .card,.fb.peek .card{transform:none;opacity:1;pointer-events:auto}
/* near the right / top edge the card grows the other way so it stays on screen */
.fb.fx .card{left:auto;right:calc(var(--cs) * var(--zk,1) / 2 + 6px);transform-origin:100% 100%;border-radius:18px 2px 18px 18px}
.fb.fy .card{bottom:auto;top:-12px;transform-origin:0 0;border-radius:2px 18px 18px 18px}
.fb.fx.fy .card{transform-origin:100% 0;border-radius:18px 2px 18px 18px}
/* the cap + title are the hover target too, so the card can be reached and clicked */
.fb .cap,.fb .t{cursor:pointer}
.fb:hover .t,.fb:focus-within .t,.fb.peek .t{opacity:0}
.fb:hover .cap,.fb.near .cap,.fb.focus .cap{transform:scale(1.35)}
.fb.near .t,.fb.focus .t{max-width:280px}
.fb.focus .cap,.fb.both .cap{filter:drop-shadow(0 0 10px rgba(var(--spore-rgb),.75))}
.fb.both .t{color:var(--spore)}
.fb.read .t{text-decoration:underline;text-decoration-color:rgba(var(--trace-rgb),.8);text-underline-offset:3px}
.fb.recent .cap{filter:drop-shadow(0 0 10px rgba(var(--trace-rgb),.8))}
.fb.far{opacity:.75}
/* 글자수 구간별 자리: 나중에 받을 비주얼(이미지·영상)은 여기서 .tier-N .cap 에 연결 */
.fb.has-spore .cap{background:var(--img) center/contain no-repeat;border-radius:0;box-shadow:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.fb.has-spore.focus .cap,.fb.has-spore.both .cap,.fb.has-spore.recent .cap{box-shadow:none;filter:drop-shadow(0 0 12px rgba(var(--spore-rgb),.6))}
.fb.tier-1 .cap{}
.fb.tier-2 .cap{}
.fb.tier-3 .cap{}
.fb.tier-4 .cap{}
.fb.tier-5 .cap{}
#labels.focus .cn:not(.focus):not(.near):not(.far),#labels.focus .fb:not(.focus):not(.near):not(.far):not(.both){opacity:.16}
#labels.focus .cn.dormant:not(.focus):not(.near):not(.far),#labels.focus .fb.dormant:not(.focus):not(.near):not(.far):not(.both){opacity:.4}
#labels.trace .fb:not(.read),#labels.trace .cn{opacity:.18}
#labels.zoomed-out .fb:not(.near):not(.focus):not(.both) .t{opacity:0}

/* ---------- chrome ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid rgba(var(--hypha),.7);border-radius:999px;color:var(--ink);background:rgba(14,15,21,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:rgba(var(--hypha),.6)}
.btn[aria-pressed="true"]{border-color:var(--trace);color:var(--trace)}
.btn.round{width:30px;padding:0;justify-content:center}
#status{color:var(--muted)}
.bottom{position:fixed;bottom:18px;left:22px;right:22px;z-index:38;display:flex;align-items:flex-end;gap:8px;pointer-events:none;transition:right .35s cubic-bezier(.2,.8,.2,1)}
.bottom>*{pointer-events:auto}
.bottom .spacer{flex:1;pointer-events:none}
body.panel-open .bottom{right:calc(var(--pw) + 22px)}
body.panel-open #status{display:none}
#hint{color:var(--muted);transition:opacity .4s;pointer-events:none}
#selbar{display:flex;flex-wrap:wrap;gap:6px}
#selbar .btn{border-color:rgba(var(--c),.6);color:rgb(var(--c))}

/* ---------- index drawer (text alternative to the map) ---------- */
#index{position:fixed;top:var(--nav-h);left:0;bottom:0;width:min(360px,100vw);z-index:45;background:rgba(14,15,21,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-right:1px solid rgba(var(--hypha),.14);transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#index.open{transform:none}
#index .head{display:flex;align-items:center;gap:8px;padding:18px 18px 12px}
#index .head .mono{flex:1;color:var(--muted)}
#index input{margin:0 18px 10px;height:34px;padding:0 12px;border:1px solid rgba(var(--hypha),.25);border-radius:999px;background:transparent;color:var(--ink);font:inherit;outline:none}
#index input:focus{border-color:var(--spore)}
#index .list{flex:1;overflow-y:auto;padding:0 18px 40px}
#index h3{margin:18px 0 8px;color:var(--muted)}
#index .concepts{display:flex;flex-wrap:wrap;gap:6px}
#index .concepts button{padding:3px 10px;border:1px solid rgba(var(--hypha),.22);border-radius:999px;font-family:var(--f-mono);font-size:11px}
#index .concepts button[aria-pressed="true"]{border-color:var(--spore);color:var(--spore)}
#index .posts button{display:flex;gap:10px;width:100%;padding:7px 0;border-bottom:1px solid rgba(var(--hypha),.08);font-family:var(--f-head);font-size:13.5px;line-height:1.4}
#index .posts button .mono{color:var(--faint);font-size:10px;padding-top:2px;flex:none}
#index .posts button.read{color:var(--trace)}
#index .posts button:hover{color:var(--spore)}

/* ---------- right panel ---------- */
#panel{position:fixed;top:var(--nav-h);right:0;bottom:0;width:var(--pw);z-index:45;background:rgba(14,15,21,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:var(--paper-ink);transform:translateX(102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-40px 0 80px rgba(0,0,0,.5)}
#panel.open{transform:none}
.p-top{display:flex;align-items:center;gap:10px;padding:18px 24px 0;color:var(--paper-muted)}
.p-top .mono:first-child{flex:1}
.p-top .btn{color:var(--paper-ink);background:transparent;border-color:rgba(255,255,255,.22)}
.p-sub{padding:4px 24px 14px;font-size:12px;color:var(--paper-muted);border-bottom:1px solid rgba(255,255,255,.1)}
.p-body{flex:1;overflow-y:auto;padding:26px 32px 90px;display:flex;flex-direction:column;gap:10px}
.p-body .no{color:var(--paper-muted)}
.p-body .spec{display:block;width:132px;height:132px;object-fit:contain;margin:-6px 0 4px -10px}
.p-body h2{font-family:var(--f-display);font-size:34px;line-height:1.1}
.p-body .en{font-family:var(--f-mono);font-size:12px;color:var(--paper-muted)}
.p-body .meta{color:var(--paper-muted)}
.p-body .hero{display:block;width:100%;height:auto;margin-top:8px;background:var(--paper-2)}
.p-sec{margin-top:36px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:10px}
.p-sec h3{color:var(--paper-muted)}
.spores{display:flex;flex-wrap:wrap;gap:6px}
.spores button{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 8px;border-radius:999px;background:var(--paper-2);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em}
.spores button::before{content:"";width:7px;height:7px;border-radius:50%;background:#7d8f2a;box-shadow:0 0 0 3px rgba(125,143,42,.18)}
.spores button:hover,.spores button[aria-pressed="true"]{background:var(--paper-ink);color:var(--spore)}
.hyphae button{display:flex;align-items:baseline;gap:10px;width:100%;padding:6px 0;font-family:var(--f-head);font-size:15px;line-height:1.4}
.hyphae button::before{content:"";width:26px;height:1px;background:currentColor;flex:none;transform:translateY(-4px);opacity:.5}
.hyphae button:hover{color:var(--link)}
.prose{margin-top:20px;font-size:16px;line-height:1.85;max-width:62ch;color:#d9dce8}
.prose>*+*{margin-top:1em}
.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{font-family:var(--f-head);font-size:17px;line-height:1.35;margin-top:1.8em;color:var(--paper-ink)}
.prose h2{font-size:20px}
.prose blockquote{margin:1.4em 0;padding:2px 0 2px 18px;border-left:2px solid var(--spore);color:#b9bdcc}
.prose blockquote>*+*{margin-top:.8em}
.prose ul,.prose ol{padding-left:1.4em;margin-bottom:0}
.prose li+li,.prose li>ul,.prose li>ol{margin-top:.3em}
.prose li>p+p{margin-top:.6em}
.prose li::marker{font-family:var(--f-mono);color:var(--paper-muted)}
.prose li.task{list-style:none;margin-left:-1.4em}
.prose li.task input{accent-color:#7d8f2a;margin:0 .3em 0 0;vertical-align:-1px}
.prose strong{font-family:var(--f-head);color:var(--paper-ink)}
.prose em{font-synthesis:style}
.prose del{color:var(--paper-muted)}
.prose code{font-family:var(--f-mono);font-size:.86em;background:var(--paper-2);padding:1px 5px}
.prose pre{margin-left:0;margin-right:0;margin-bottom:0;padding:12px 16px;background:var(--paper-2);overflow-x:auto;line-height:1.6}
.prose pre code{background:none;padding:0;font-size:13px;white-space:pre}
.prose hr{border:0;border-top:1px solid rgba(255,255,255,.16);margin:2em 0}
.prose img{display:block;max-width:100%;height:auto}
.prose .table{overflow-x:auto}
.prose table{border-collapse:collapse;font-size:14px;line-height:1.5;min-width:50%}
.prose th,.prose td{padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:top}
.prose th{font-family:var(--f-head);background:var(--paper-2)}
.prose a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

#info{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(5,6,4,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#info.open{display:grid}
.info-card{width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;padding:28px;background:var(--paper);color:#d9dce8;display:flex;flex-direction:column;gap:12px;font-size:14.5px;line-height:1.75;border-radius:2px 24px 24px 24px}
.info-card h2{font-family:var(--f-display);font-size:28px;color:var(--paper-ink)}
.info-card b{font-family:var(--f-head);color:var(--paper-ink)}
.info-card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.info-card dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-muted);padding-top:3px}
.info-card dd{margin:0}
.info-card .row{display:flex;gap:6px;margin-top:6px}
.info-card .btn{color:var(--paper-ink);background:transparent;border-color:rgba(255,255,255,.25)}
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

@media (max-width:768px){
  #status,#hint{display:none}
  .p-body{padding:22px 20px 90px}
  .p-body h2{font-size:28px}
  body.panel-open .bottom{display:none}
  .fb .card{width:230px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 배양 기질(배경). 나중에 이미지·영상을 받으면 MEDIA에 경로를 넣으면 여기에 깔림 -->
<div id="substrate" aria-hidden="true"></div>
<main id="dish" aria-label="Rhizome map">
  <canvas id="myc"></canvas>
  <canvas id="spores"></canvas>
  <div id="labels"></div>
</main>

<header id="nav"></header>
<div class="bottom">
  <button class="btn" data-action="index" aria-expanded="false" aria-controls="index" id="index-btn"></button>
  <div id="selbar" aria-live="polite"></div>
  <span id="hint" class="mono"></span>
  <span class="spacer"></span>
  <span id="status" class="mono"></span>
  <button class="btn" data-action="trace" aria-pressed="false" id="trace-btn"></button>
  <button class="btn round" data-action="zoom-out" aria-label="축소">−</button>
  <button class="btn round" data-action="zoom-in" aria-label="확대">+</button>
  <button class="btn" data-action="fit" id="fit-btn"></button>
</div>

<nav id="index" aria-label="Index"></nav>
<aside id="panel" aria-label="Article"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/spore/shared.js"></script>
<script>
(() => {
"use strict";

/* ===================== 미디어 자리 (나중에 받을 이미지·영상) ===================== */
// 배양 기질 배경: 영상이 있으면 영상, 없으면 이미지, 둘 다 없으면 CSS 질감만
const MEDIA = { substrateVideo: "", substrateImage: "" };

/* ===================== shared (data · spore art · network · language) come from /spore/shared.js ===================== */
const { $, esc, hash, rnd, clamp, fmtDate, REDUCE, plain } = SP.util;
const t = SP.t, rhizomeMd = SP.rhizomeMd, toast = SP.toast;
const now = () => performance.now();
let G = null;
const TIER_SIZE = { 1: 34, 2: 44, 3: 56, 4: 120, 5: 150 }; // 포자 크기(px, 확대 100% 기준) — 4~5단계는 3D 포자라 크게
const SPORE_IMG_SCALE = 1;
const ekey = (a, b) => [a, b].sort().join("|");

/* ===================== state ===================== */
// concepts: selected concept ids (colonies) · post: open post id · dormant: ids that were once in focus
// grown: edge key -> time its hypha started growing · trail: posts read, in order (this browser only)
const st = { concepts: [], post: null, recent: null, dormant: new Set(), sleep: new Set(), grown: new Map(), level: new Map(), both: new Set(), trace: false, peek: null };
const TRAIL_KEY = "rhizome-spore-trail";
let trail = []; try { trail = JSON.parse(localStorage.getItem(TRAIL_KEY) || "[]").filter(x => typeof x === "string").slice(-300); } catch {}
const saveTrail = () => { try { localStorage.setItem(TRAIL_KEY, JSON.stringify(trail)); } catch {} };
const COLONY = ["--colony-1", "--colony-2", "--colony-3"].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());

/* levels: 0 = in focus, 1 = one hypha away, 2 = two away (only from a concept) */
function computeFocus() {
  const lv = new Map(), set = (id, l) => { if (!lv.has(id) || lv.get(id) > l) lv.set(id, l); };
  st.concepts.forEach(c => { set(c, 0); G.nbr.get(c).forEach(p => { set(p, 1); G.nbr.get(p).forEach(x => set(x, 2)); }); });
  if (st.post) { set(st.post, 0); G.nbr.get(st.post).forEach(x => set(x, 1)); }
  // a post that two selected colonies share
  const both = new Set();
  if (st.concepts.length > 1) G.posts.forEach(p => { const id = "p:" + p.id; if (st.concepts.filter(c => G.nbr.get(c).has(id)).length > 1) both.add(id); });
  // hyphae that just became active start growing now (direct ones first, the next ring a little later)
  const t = now(), next = new Map();
  G.edges.forEach(e => {
    const la = lv.get(e.a), lb = lv.get(e.b); if (la === undefined || lb === undefined) return;
    const lo = Math.min(la, lb); if (lo > 1 || (la === 2 && lb === 2)) return;
    next.set(e.k, st.grown.has(e.k) ? st.grown.get(e.k) : t + (REDUCE ? -1e6 : lo * 260 + (hash(e.k) % 120)));
  });

dish.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
dish.addEventListener("click", e => {
  if (e.target.closest(".cn,.fb") || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  if (st.concepts.length) writeHash([], st.post);
});
// hovering a spore / hypha in the panel shows where it leads on the map
panel.addEventListener("pointerover", e => { const t = e.target.closest("[data-peek]"); const id = t ? t.dataset.peek : null; if (id === st.peek) return; setPeek(id); });
panel.addEventListener("pointerleave", () => setPeek(null));
panel.addEventListener("focusin", e => { const t = e.target.closest("[data-peek]"); setPeek(t ? t.dataset.peek : null); });
function setPeek(id) {
  if (st.peek) { const el = labels.querySelector(`[data-node="${CSS.escape(st.peek)}"]`); el && el.classList.remove("peek"); }
  st.peek = id;
  if (id) { const el = labels.querySelector(`[data-node="${CSS.escape(id)}"]`); el && el.classList.add("peek"); bring(id, 500); if (!REDUCE) { const A = G.byId.get(st.post), B = G.byId.get(id); if (A && B) for (let i = 0; i < 5; i++) bursts.push({ ax: A.x, ay: A.y, bx: B.x, by: B.y, cx: (A.x + B.x) / 2 + (Math.random() - .5) * 90, cy: (A.y + B.y) / 2 + (Math.random() - .5) * 90, t0: now() + i * 70, d: 700, r: 1.4 }); } }
  drawMyc(); kick();
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (idx.classList.contains("open")) openIndex(false);
  else if (st.post) writeHash(st.concepts, null);
  else if (st.concepts.length) writeHash([], null);
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { size(); seedMotes(); drawAll(); }, 100); });

/* ===================== status · chrome text (language-aware) ===================== */
function renderStatus() {
  const pp = G.edges.filter(e => e.kind === "pp").length;
  $("#status").textContent = `${G.posts.length} articles · ${G.concepts.length} spores · ${pp} hyphae` + (SP.src === "sample" ? " · sample" : SP.src === "cache" ? " · offline" : "");
}
function renderChrome() {
  document.title = `${t("navRhizome")} · ${t("titleFlat")}`;
  SP.renderNav("rhizome");
  $("#index-btn").textContent = t("index"); $("#fit-btn").textContent = t("fit"); $("#hint").textContent = t("hint");
  $("#trace-btn").textContent = t("myHyphae");
  $("[data-action=zoom-in]").setAttribute("aria-label", t("zoomIn")); $("[data-action=zoom-out]").setAttribute("aria-label", t("zoomOut"));
}

/* ===================== media ===================== */
function mountMedia() {
  const s = $("#substrate");
  if (MEDIA.substrateVideo) s.innerHTML = `<video src="${esc(MEDIA.substrateVideo)}" autoplay muted loop playsinline${REDUCE ? "" : ""}></video>`;
  else if (MEDIA.substrateImage) s.innerHTML = `<img src="${esc(MEDIA.substrateImage)}" alt="">`;
  if (REDUCE) { const v = s.querySelector("video"); v && v.removeAttribute("autoplay"); }
}


/* ===================== boot ===================== */
function boot() {
  G = SP.network();
  st.grown.clear(); st.sleep.clear(); st.dormant.clear(); st.level.clear(); st.colonyBorn.clear();
  readColors(); size(); renderChrome(); renderLabels(); renderStatus(); seedMotes();
  fit(0);
  applyHash(); drawAll(); kick();
}
if (typeof d3 === "undefined") {
  document.body.innerHTML = '<p style="padding:24px;font-family:monospace;color:#eef0f7;background:#07080c">Could not load the map library. Please reload the page.</p>';
} else {
  mountMedia();
  SP.renderNav("rhizome");
  SP.onData(boot);
  // language switch: relabel everything, keep where you are on the map
  SP.onLang(() => { renderChrome(); renderLabels(); placeLabels(); applyClasses(); if (st.post) renderPanel(); if (idx.classList.contains("open")) openIndex(true); });
  SP.ready.then(boot);
}
})();
</script>
</body>
