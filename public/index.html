<title>부드러운 리좀 FLUFFY RHIZOME</title>
<style>
/* ---------- fonts: English + digits = Space Mono, Hangul + all punctuation = kigsans ---------- */
@font-face{font-family:"Space Mono";src:url("fonts/SpaceMono-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Space Mono";src:url("fonts/SpaceMono-Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Space Mono";src:url("fonts/SpaceMono-Italic.woff") format("woff");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Space Mono";src:url("fonts/SpaceMono-BoldItalic.woff") format("woff");font-weight:700;font-style:italic;font-display:swap}
/* Hangul + punctuation = kigsans (긱산스). display = Black, headings = Bold, body = Light/Regular/Medium/Bold/Black by weight */
@font-face{font-family:"Kig Display";src:url("fonts/kigsans-Black.otf") format("opentype");font-weight:100 900;font-display:swap;unicode-range:U+0020-002F,U+003A-0040,U+005B-0060,U+007B-007E,U+00A0-00BF,U+00D7,U+00F7,U+1100-11FF,U+2010-205E,U+2190-21FF,U+2460-24FF,U+25A0-25FF,U+2600-26FF,U+3000-303F,U+3130-318F,U+3200-32FF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:"Kig Head";src:url("fonts/kigsans-Bold.otf") format("opentype");font-weight:100 900;font-display:swap;unicode-range:U+0020-002F,U+003A-0040,U+005B-0060,U+007B-007E,U+00A0-00BF,U+00D7,U+00F7,U+1100-11FF,U+2010-205E,U+2190-21FF,U+2460-24FF,U+25A0-25FF,U+2600-26FF,U+3000-303F,U+3130-318F,U+3200-32FF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:"Kig Body";src:url("fonts/kigsans-Light.otf") format("opentype");font-weight:300;font-display:swap;unicode-range:U+0020-002F,U+003A-0040,U+005B-0060,U+007B-007E,U+00A0-00BF,U+00D7,U+00F7,U+1100-11FF,U+2010-205E,U+2190-21FF,U+2460-24FF,U+25A0-25FF,U+2600-26FF,U+3000-303F,U+3130-318F,U+3200-32FF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:"Kig Body";src:url("fonts/kigsans-Regular.otf") format("opentype");font-weight:400;font-display:swap;unicode-range:U+0020-002F,U+003A-0040,U+005B-0060,U+007B-007E,U+00A0-00BF,U+00D7,U+00F7,U+1100-11FF,U+2010-205E,U+2190-21FF,U+2460-24FF,U+25A0-25FF,U+2600-26FF,U+3000-303F,U+3130-318F,U+3200-32FF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:"Kig Body";src:url("fonts/kigsans-Medium.otf") format("opentype");font-weight:500;font-display:swap;unicode-range:U+0020-002F,U+003A-0040,U+005B-0060,U+007B-007E,U+00A0-00BF,U+00D7,U+00F7,U+1100-11FF,U+2010-205E,U+2190-21FF,U+2460-24FF,U+25A0-25FF,U+2600-26FF,U+3000-303F,U+3130-318F,U+3200-32FF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:"Kig Body";src:url("fonts/kigsans-Bold.otf") format("opentype");font-weight:700;font-display:swap;unicode-range:U+0020-002F,U+003A-0040,U+005B-0060,U+007B-007E,U+00A0-00BF,U+00D7,U+00F7,U+1100-11FF,U+2010-205E,U+2190-21FF,U+2460-24FF,U+25A0-25FF,U+2600-26FF,U+3000-303F,U+3130-318F,U+3200-32FF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:"Kig Body";src:url("fonts/kigsans-Black.otf") format("opentype");font-weight:900;font-display:swap;unicode-range:U+0020-002F,U+003A-0040,U+005B-0060,U+007B-007E,U+00A0-00BF,U+00D7,U+00F7,U+1100-11FF,U+2010-205E,U+2190-21FF,U+2460-24FF,U+25A0-25FF,U+2600-26FF,U+3000-303F,U+3130-318F,U+3200-32FF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}

html{
  /* Dell 1996: black page frame, black top banner, square flat color blocks, yellow stickers, red reserved for one callout.
     Light (.light) by default; dark only when the viewer toggles it. Layout: framed full-screen graph/gallery under a black banner */
  --frame:#000000;
  /* chrome = top banner + page frame; follows the theme */
  --chrome:#000000; --chrome-ink:#ffffff; --chrome-muted:#d9d9d9; --chrome-pill:#2b2b2b; --chrome-line:rgba(255,255,255,.12);
  --canvas:#141414;
  --surface:#1f1f1f;
  --surface-2:#2b2b2b;
  --ink:#ffffff;
  --body:#e6e6e6;
  --muted:#a3a3a3;
  --on-ink:#000000;
  --primary:#e91d2a;
  --sticker:#fcc20f;
  --purple:#6a26a4;
  --link:#8fa2ff;
  --tint-olive:#8e8a25; --tint-sage:#b3bd95; --tint-salmon:#d77a7a; --tint-peach:#e6915d;
  --tint-lime:#c0d4a7; --tint-sky:#9ab6c8; --tint-steel:#a5b8c0; --tint-periwinkle:#8c9ae0;
  --tint-lavender:#b9a3d6; --tint-mustard:#dcb44a; /* category colors = these 10 tints (admin SWATCHES) */
  --on-tint:#000000;
  --veil:rgba(20,20,20,.55);
  --line:255,255,255;
  --f-display:"Kig Display","Space Mono","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-head:"Kig Head","Space Mono","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-body:"Kig Body","Space Mono","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font:var(--f-body);
  --sp-xxs:2px; --sp-xs:4px; --sp-s:6px; --sp-sm:8px; --sp-m:10px; --sp-md:12px; --sp-lg:16px; --sp-xl:20px; --sp-xxl:24px;
  --sec-sm:32px; --sec:40px; --sec-lg:48px;
  --fw:8px; --bh:56px;
  color-scheme:dark;
}
html.light{
  --chrome:#ffffff; --chrome-ink:#000000; --chrome-muted:#555555; --chrome-pill:#eeeeee; --chrome-line:rgba(0,0,0,.12);
  --canvas:#ffffff;
  --surface:#ffffff;
  --surface-2:#eeeeee;
  --ink:#000000;
  --body:#000000;
  --muted:#555555;
  --on-ink:#ffffff;
  --link:#0000ee;
  --veil:rgba(255,255,255,.55);
  --line:0,0,0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;font-synthesis:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--sticker);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- labels: flat color only, square, no outline ---------- */
.pill{text-decoration:none;display:inline-flex;align-items:center;gap:var(--sp-s);height:26px;padding:0 var(--sp-m);border-radius:0;font-family:var(--f-head);font-size:13px;font-weight:700;white-space:nowrap;
  background:var(--c,var(--surface-2));color:var(--on,var(--ink));transition:opacity .2s,filter .2s}
.pill.glass{background:var(--surface-2);color:var(--ink)}
.pill.meta{background:transparent;color:var(--muted);font-family:var(--f-body);font-weight:400;font-size:12px;height:22px;padding:0 var(--sp-s) 0 0}
.pill.dark{background:var(--ink);color:var(--on-ink)}
.pill.primary{background:var(--ink);color:var(--on-ink);height:32px;padding:0 var(--sp-lg);text-transform:uppercase}
.pill.round{width:30px;height:30px;padding:0;justify-content:center}
.pill.lg{height:auto;min-height:40px;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.05;padding:var(--sp-sm) var(--sp-lg);white-space:normal}
.pill.xl{display:block;width:100%;height:auto;font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.05;padding:var(--sp-xxl) var(--sp-lg);white-space:normal}
.pill.sticker{background:var(--sticker);color:#000;box-shadow:2px 2px 0 #000;transform:rotate(-3deg)}
button.pill:hover{filter:brightness(1.08)}
.pill svg{width:14px;height:14px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:var(--sp-xs);align-items:center}

/* ---------- frame + banner ---------- */
#frame{position:fixed;inset:0;border:var(--fw) solid var(--chrome);pointer-events:none;z-index:60}
.banner{position:fixed;top:0;left:0;right:0;height:calc(var(--bh) + var(--fw));padding:var(--fw) calc(var(--fw) + var(--sp-lg)) 0;background:var(--chrome);color:var(--chrome-ink);box-shadow:0 1px 0 var(--chrome-line);display:flex;align-items:center;gap:var(--sp-lg);z-index:55}
.brand{display:flex;align-items:baseline;gap:var(--sp-md);text-decoration:none;color:var(--chrome-ink);min-width:0}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.brand span{font-family:var(--f-head);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--chrome-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callout{font-family:var(--f-head);font-weight:700;font-size:14px;color:var(--primary);white-space:nowrap}
.banner .spacer{flex:1}
.banner .tools{display:flex;align-items:center;gap:var(--sp-xs)}
.banner .tools .pill{background:var(--chrome-pill);color:var(--chrome-ink)}
#search{width:0;opacity:0;padding:0;transition:width .2s,opacity .2s,padding .2s;border:none;outline:none;height:30px;border-radius:0;background:var(--chrome-pill);color:var(--chrome-ink);font:inherit;font-size:13px}
#search.open{width:200px;opacity:1;padding:0 var(--sp-m)}
#search::placeholder{color:var(--chrome-muted)}

/* ---------- layers ---------- */
.view{position:fixed;top:calc(var(--bh) + var(--fw));left:var(--fw);right:var(--fw);bottom:var(--fw);z-index:1;background:var(--canvas)}
#graph-view{z-index:1}
#graph-view .layer{position:absolute;inset:0;z-index:3}
body:not(.v-graph) #graph-view{visibility:hidden}
body:not(.v-gallery) #gallery-view{visibility:hidden}
body.v-gallery .hud.bl{display:none}
#graph-view{cursor:grab;touch-action:none}
#graph-view:active{cursor:grabbing}
#links{position:absolute;inset:0;width:100%;height:100%;z-index:3}
#labels{position:absolute;inset:0;z-index:4}

/* graph labels */
.node{position:absolute;left:0;top:0;will-change:transform;user-select:none;touch-action:none;transition:opacity .25s,width .2s,height .2s,padding .2s,font-size .2s}
/* tags: outline only (no fill), headline gothic */
.node.tag{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:12px;height:22px;padding:0 var(--sp-s);border:1px solid var(--ink);border-radius:999px;transition:opacity .25s,width .2s,height .2s,padding .2s,font-size .2s,border-radius .25s}
.node.tag::before{display:none}
.node.cat{height:auto;font-family:var(--f-display);font-size:22px;line-height:1;padding:var(--sp-md) calc(var(--sp-lg) + 8px)}
.node.post{font-family:var(--f-head);height:auto;line-height:1.3;padding:8px calc(var(--sp-m) + 8px + 16px)}
.node.dim{opacity:.15}
/* every node is a full pill. Resting: sharp text on a softly blurred pill fill · hover (or keyboard focus): the fill sharpens.
   The fill lives in ::before so only the background blurs, never the text. */
.node{background:transparent!important;isolation:isolate;border-radius:999px}
.node::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--c,var(--surface-2));border-radius:999px;filter:blur(10px);transition:filter .25s}
.node:hover,.node.hover,.node:focus-visible{z-index:1}
.node:hover::before,.node.hover::before,.node:focus-visible::before,.node.on::before{filter:none}
#labels.far .node::before{filter:blur(2px)}
/* selected (clicked) = same sharp pill as hover, no shadow */
#labels.far .node:not(.on){font-size:0!important;width:12px;height:12px;padding:0;gap:0}
#labels.far .node.tag:not(.on){width:6px;height:6px;border-color:rgba(var(--line),.5)}
#labels.far .node.cat:not(.on){width:20px;height:20px}

#tip{position:fixed;z-index:58;pointer-events:none;opacity:0;transition:opacity .12s;transform:translate(12px,14px)}
#tip.show{opacity:1}
#tip.img{transform:none;height:auto;padding:0;flex-direction:column;align-items:stretch;gap:0;background:var(--ink);box-shadow:3px 3px 0 var(--frame);max-width:260px}
#tip.img img{display:block;width:260px;max-height:260px;object-fit:cover;background:var(--surface-2)}
#tip.img span{padding:var(--sp-s) var(--sp-m);white-space:normal;line-height:1.3}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:20;display:flex;gap:var(--sp-xs);align-items:flex-start}
.hud.bl{bottom:calc(var(--fw) + var(--sp-lg));left:calc(var(--fw) + var(--sp-lg));flex-direction:column-reverse;align-items:flex-start}
.hud.br{bottom:calc(var(--fw) + var(--sp-lg));right:calc(var(--fw) + var(--sp-lg));align-items:flex-end}
.hud .pill{background:var(--ink);color:var(--on-ink);text-transform:uppercase}
.views{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-xs)}
.views .menu{display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-xs)}
.views .menu .pill{opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .15s,transform .2s;background:var(--surface-2);color:var(--ink)}
.views.open .menu .pill{opacity:1;transform:none;pointer-events:auto}
.views .menu .pill[aria-current="true"]{background:var(--sticker);color:#000}
.zoomctl{display:flex;gap:var(--sp-xs);margin-right:var(--sp-sm)}
body:not(.v-graph) .zoomctl{display:none}
.legend{display:none;flex-direction:column;gap:var(--sp-sm);padding:var(--sp-md) var(--sp-lg);background:var(--surface);max-width:340px;font-size:13px;color:var(--body);box-shadow:3px 3px 0 var(--frame)}
.legend.open{display:flex}
.legend .hint{line-height:1.6}

/* ---------- gallery view: square image tiles, image fills the tile by height ---------- */
#gallery-view{overflow-x:hidden;overflow-y:auto}
/* gallery = a free board: cards sit at scattered positions (no grid), may overlap, and can be dragged anywhere */
.gallery{position:relative;min-height:100%}
.tile{position:absolute;left:0;top:0;display:block;width:var(--ts,400px);aspect-ratio:1;overflow:hidden;background:var(--c,var(--surface-2));color:var(--on,var(--ink));text-align:left;cursor:grab;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* height-based fill: image always spans the full tile height, centered; wider images crop at the sides */
.tile.has-img{background:var(--surface-2)}
.tile img{position:absolute;top:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-50%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
/* hover / pressed / dragging: the category color covers the whole card and only the title grows */
.tile::after{content:"";position:absolute;inset:0;background:var(--c,var(--surface-2));opacity:0;transition:opacity .2s;pointer-events:none}
.tile .cap,.tile .ttl,.tile .sub{z-index:1}
.tile:hover::after,.tile:active::after,.tile.dragging::after,.tile.pressed::after,.tile:focus-visible::after{opacity:1}
.tile:hover .cap,.tile:active .cap,.tile.dragging .cap,.tile.pressed .cap,.tile:focus-visible .cap{font-size:30px;line-height:1.15;padding:var(--sp-lg) var(--sp-xl)}
.tile:hover .ttl,.tile:active .ttl,.tile.dragging .ttl,.tile.pressed .ttl,.tile:focus-visible .ttl{font-size:42px}
.tile.dragging{cursor:grabbing}
body.g-dragging,body.g-dragging .tile{cursor:grabbing}
.tile .cap{position:absolute;left:0;bottom:0;max-width:100%;height:auto;min-height:30px;padding:var(--sp-xs) var(--sp-m);white-space:normal;line-height:1.3;font-size:14px;transition:font-size .2s,padding .2s,line-height .2s}
.tile .ttl{position:absolute;inset:0;padding:var(--sp-xl) var(--sp-lg);font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;overflow:hidden;transition:font-size .2s}
.tile .sub{position:absolute;left:var(--sp-lg);bottom:var(--sp-lg);font-family:var(--f-head);font-size:13px;font-weight:700;opacity:.75}
.tile.on{box-shadow:inset 0 0 0 var(--fw) var(--sticker)}
.tile:focus-visible{outline-offset:-4px}
.empty-list{color:var(--muted);text-align:center;padding-top:30vh}
#graph-empty{position:absolute;inset:0;margin:0;z-index:5;pointer-events:none}

/* ---------- local graph overlay ---------- */
#local{position:fixed;top:calc(var(--bh) + var(--fw));left:var(--fw);right:var(--fw);bottom:var(--fw);z-index:25;background:var(--veil);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none}
#local.open{display:block;animation:fade .2s ease-out}
#local svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#local line{stroke:rgba(var(--line),.8);stroke-width:1;opacity:0;transition:opacity .3s .2s}
#local.ready line{opacity:1}
#local .lnode{position:absolute;left:0;top:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:0}
#local.ready .lnode{opacity:1}
#local .lfoot{position:absolute;bottom:var(--sp-lg);left:50%;transform:translateX(-50%);display:flex;gap:var(--sp-xs)}
#local .lfoot .pill{background:var(--ink);color:var(--on-ink);text-transform:uppercase}
@keyframes fade{from{opacity:0}}

/* ---------- reader ---------- */
#reader{position:fixed;top:calc(var(--bh) + var(--fw));right:var(--fw);bottom:var(--fw);width:min(600px,calc(100% - 2 * var(--fw)));z-index:26;background:var(--surface);border-left:var(--fw) solid var(--chrome);box-shadow:-1px 0 0 var(--chrome-line);transform:translateX(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#reader.open{transform:none}
.reader-top{display:flex;justify-content:flex-end;gap:var(--sp-xs);padding:var(--sp-md) var(--sp-lg) 0}
.reader-top .pill{background:var(--ink);color:var(--on-ink);text-transform:uppercase}
.reader-body{flex:1;overflow-y:auto;padding:var(--sp-md) var(--sp-xxl) 80px;display:flex;flex-direction:column;gap:var(--sp-sm)}
.reader-body .en{color:var(--muted);font-size:13px;margin:var(--sp-xs) 0}
.prose{margin-top:var(--sp-xl);font-size:16px;line-height:1.8;max-width:60ch;color:var(--body)}
.prose>*+*{margin-top:1em}
.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{font-family:var(--f-head);font-weight:700;font-size:16px;line-height:1.35;color:var(--ink);margin-top:1.8em;padding:var(--sp-s) var(--sp-md);background:var(--surface-2);display:inline-block}
.prose h2{font-size:19px}
.prose h5,.prose h6{font-size:14px}
.prose blockquote{margin:1.4em 0;padding:var(--sp-md) var(--sp-lg);background:var(--tint-sage);color:#000}
.prose blockquote>*+*{margin-top:.8em}
.prose blockquote blockquote{margin:.8em 0 0;background:rgba(0,0,0,.08)}
.prose blockquote a,.prose blockquote strong{color:#000}
.prose ul,.prose ol{padding-left:1.4em;margin-bottom:0}
.prose li+li,.prose li>ul,.prose li>ol{margin-top:.3em}
.prose li>p+p{margin-top:.6em}
.prose li::marker{font-family:"Space Mono",var(--f-body);color:var(--muted)}
.prose li.task{list-style:none;margin-left:-1.4em}
.prose li.task input{accent-color:var(--sticker);margin:0 .3em 0 0;vertical-align:-1px}
.prose strong{font-family:var(--f-head);color:var(--ink)}
.prose em{font-synthesis:style}
.prose del{color:var(--muted)}
.prose code{font-family:"Space Mono",var(--f-body);font-size:.86em;background:var(--surface-2);padding:1px 5px}
.prose pre{margin-left:0;margin-right:0;margin-bottom:0;padding:var(--sp-md) var(--sp-lg);background:var(--surface-2);overflow-x:auto;line-height:1.6}
.prose pre code{background:none;padding:0;font-size:13px;white-space:pre}
.prose hr{border:0;height:var(--fw);background:var(--ink);margin:2em 0}
.prose img{display:block;max-width:100%;height:auto}
.prose .table{overflow-x:auto}
.prose table{border-collapse:collapse;font-size:14px;line-height:1.5;min-width:50%}
.prose th,.prose td{padding:var(--sp-s) var(--sp-md);border-bottom:1px solid rgba(var(--line),.2);text-align:left;vertical-align:top}
.prose th{font-family:var(--f-head);font-weight:700;color:var(--ink);background:var(--surface-2)}

let G = null;
function buildGraph(data) {
  const cats = new Map((data.categories || []).map(c => [c.id, c]));
  const nodes = [], links = [], byId = new Map();
  const add = n => { byId.set(n.id, n); nodes.push(n); return n; };
  const posts = (data.nodes || []).filter(p => p && p.title);
  const used = new Set(posts.map(p => p.category));
  cats.forEach(c => { if (used.has(c.id)) add({ id:"c:" + c.id, type:"cat", label:c.name, color:c.color || NEUTRAL, cat:c }); });
  posts.forEach(p => { const c = cats.get(p.category); add({ id:"p:" + p.id, type:"post", label:p.title, color:c ? c.color : NEUTRAL, post:p, weight:Number(p.weight) || 5 }); });
  const tagN = new Map();
  posts.forEach(p => (p.tags || []).forEach(t => tagN.set(t, (tagN.get(t) || 0) + 1)));
  tagN.forEach((n, t) => add({ id:"t:" + t, type:"tag", label:t, count:n }));
  const seen = new Set();
  const link = (a, b, rel, kind) => {
    if (a === b || !byId.has(a) || !byId.has(b)) return;
    const k = [a, b].sort().join("|"); if (seen.has(k)) return; seen.add(k);
    links.push({ source:a, target:b, sid:a, tid:b, rel, kind });
  };
  posts.forEach(p => {
    if (cats.has(p.category)) link("p:" + p.id, "c:" + p.category, "카테고리", "cat");
    (p.tags || []).forEach(t => link("p:" + p.id, "t:" + t, "태그", "tag"));
  });
  const tagsOf = id => (byId.get("p:" + id)?.post.tags) || [];
  (data.links || []).forEach(l => {
    const shared = tagsOf(l.source).filter(t => tagsOf(l.target).includes(t));
    link("p:" + l.source, "p:" + l.target, shared.length ? "#" + shared[0] : "연결", "post");
  });
  const nbr = new Map(nodes.map(n => [n.id, new Set()]));
  links.forEach(l => { nbr.get(l.sid).add(l.tid); nbr.get(l.tid).add(l.sid); });
  return { nodes, links, byId, nbr, posts, cats:[...cats.values()].filter(c => used.has(c.id)) };
}
const postNode = id => G.byId.get("p:" + id);

function initGraph() {

/* wheel / trackpad:

// rectangle collision so wide text labels never overlap (labels are measured in screen px)
function rectCollide(pad) {
  let nodes = [], maxW = 0, maxH = 0;

    const q = d3.quadtree(nodes, d => d.x, d => d.y);

    maxW = (d3.max(nodes, d => d.w) || 0) / 2 * sc + pad; maxH = (d3.max(nodes, d => d.h) || 0) / 2 * sc + pad;

      const aw = a.w / 2 * sc + pad, ah = a.h / 2 * sc + pad;
      q.visit((quad, x0, y0, x1, y1) => {
        const b = quad.data;
        if (b && b !== a && b.index > a.index) {
          const bw = b.w / 2 * sc + pad, bh = b.h / 2 * sc + pad;
          const dx = a.x - b.x || (Math.random() - .5), dy = a.y - b.y || (Math.random() - .5);
          const ox = aw + bw - Math.abs(dx), oy = ah + bh - Math.abs(dy);

function fit(ms = 700) {

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;

function render() {

    const x = T.applyX(n.x), y = T.applyY(n.y);

  }

  const act = [];
  ctx.lineWidth = 0.7;

  ctx.beginPath();

/* ===================== gallery view ===================== */

function openLocal(id) {
  const p = G.posts.find(x => x.id === id); if (!p) return;

  const items = [];
  if (c) items.push({ kind:"cat", label:c.name, color:c.color, go:"c:" + c.id });
  (p.tags || []).forEach(t => items.push({ kind:"tag", label:"#" + t, go:"t:" + t }));
  if (p.date) items.push({ kind:"year", label:String(p.date).slice(0, 4), color:null, sticker:true });
  linkedPosts(id).forEach(o => { const oc = catOf(o); items.push({ kind:"post", label:o.title, color:oc ? oc.color : NEUTRAL, id:o.id }); });
  const w = innerWidth, h = innerHeight, cx = w / 2, cy = h * 0.46;
  const rx = Math.min(w * 0.38, 420), ry = Math.min(h * 0.34, 290);

  const pos = items.map((it, i) => {
    const a = a0 + i / items.length * Math.PI * 2, j = 0.78 + (hash(id + i) % 30) / 100;

/* ===================== markdown ===================== */
/* rhizome-md:start */
function rhizomeMd(src) {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const safeUrl = u => {
    u = String(u || "").trim().replace(/^<([\s\S]*)>$/, "$1");
    const probe = u.replace(/&#x?[0-9a-f]+;?|&colon;?/gi, ":").replace(/[\s\x00-\x1f]/g, "").toLowerCase();
    return /^[a-z][a-z0-9+.-]*:/.test(probe) && !/^(https?|mailto|tel):/.test(probe) ? "" : u;
  };
  const inline = (s, inLink) => {
    const keep = [], put = h => "\u0000" + (keep.push(h) - 1) + "\u0000";
    s = s.replace(inLink ? /\u0000/g : /[\u0000\u0001]/g, "");
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!~|>])/g, (_, c) => put(esc(c)));
    s = s.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (_, f, c) => put(`<code>${esc(c.replace(/^ ([\s\S]*) $/, "$1"))}</code>`));
    const target = String.raw`\(\s*(<[^>\n]*>|(?:[^\s()]|\([^\s()]*\))+)(?:\s+"([^"]*)")?\s*\)`;
    s = s.replace(new RegExp(String.raw`!\[([^\]]*)\]` + target, "g"), (_, alt, url, title) => {
      const u = safeUrl(url);
      return put(u ? `<img src="${esc(u)}" alt="${esc(alt)}"${title ? ` title="${esc(title)}"` : ""} loading="lazy">` : esc(alt));
    });
    const a = (u, title) => `<a href="${esc(u)}"${title ? ` title="${esc(title)}"` : ""}${/^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : ""}>`;
    if (!inLink) {
      s = s.replace(new RegExp(String.raw`\[((?:[^\[\]]|\[[^\]]*\])+)\]` + target, "g"), (_, text, url, title) => {
        const u = safeUrl(url), t = inline(text.replace(/\u0000(\d+)\u0000/g, (_, i) => "\u0001" + i + "\u0001"), true).replace(/\u0001(\d+)\u0001/g, (_, i) => keep[i]);
        return u ? put(a(u, title) + t + "</a>") : put(t);
      });
      s = s.replace(/<((?:https?:\/\/|mailto:)[^\s<>]+)>/g, (_, u) => put(a(u) + esc(u.replace(/^mailto:/, "")) + "</a>"));
      s = s.replace(/\bhttps?:\/\/[^\s<>\u0000]*[^\s<>\u0000.,:;"')\]!?]/g, u => put(a(u) + esc(u) + "</a>"));
    }
    s = esc(s)
      .replace(/(\*\*\*|___)(?=\S)([\s\S]*?\S)\1/g, "<strong><em>$2</em></strong>")
      .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, "$1<strong>$2</strong>")
      .replace(/\*(?=[^\s*])([^*]*?[^\s*]|[^\s*])\*/g, "<em>$1</em>")
      .replace(/(^|[^\w])_(?=[^\s_])([^_]*?[^\s_]|[^\s_])_(?!\w)/g, "$1<em>$2</em>")
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>")
      .replace(/ {2,}\n|\\\n|\n/g, "<br>\n");
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[i]);
  };

  const FENCE = /^ {0,3}(`{3,}|~{3,})\s*([^\s`]*)[^`]*$/, HEAD = /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/,
    HR = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/, QUOTE = /^ {0,3}>/, LI = /^( *)([-*+]|\d{1,9}[.)])(?:[ \t]+|$)/,
    TSEP = /^ *\|? *:?-+:? *(?:\| *:?-+:? *)*\|? *$/, SETEXT = /^ {0,3}(=+|-+)[ \t]*$/;
  const indentOf = l => l.match(/^ */)[0].length;
  const blank = l => /^\s*$/.test(l);
  const cells = row => {
    const out = []; let cur = "", tick = false;
    row = row.trim().replace(/^\|/, "").replace(/(^|[^\\])\|$/, "$1");
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === "\\" && row[i + 1] === "|") { cur += "|"; i++; continue; }
      if (c === "`") tick = !tick;
      if (c === "|" && !tick) { out.push(cur.trim()); cur = ""; } else cur += c;
    }
    out.push(cur.trim());
    return out;
  };
  const isTable = (ls, i) => ls[i].includes("|") && i + 1 < ls.length && ls[i + 1].includes("-") && TSEP.test(ls[i + 1]) && (ls[i + 1].includes("|") || cells(ls[i]).length > 1);
  const starts = (ls, i) => FENCE.test(ls[i]) || HEAD.test(ls[i]) || HR.test(ls[i]) || QUOTE.test(ls[i]) || LI.test(ls[i]) || isTable(ls, i);

  function list(ls, i) {
    const m0 = ls[i].match(LI), base = m0[1].length, ordered = /\d/.test(m0[2]);
    const items = []; let loose = false;
    while (i < ls.length) {
      const m = ls[i].match(LI);
      if (!m || m[1].length !== base || /\d/.test(m[2]) !== ordered) break;
      const pad = Math.min(m[0].length, base + 6);
      const body = [ls[i].slice(m[0].length)];
      i++;
      while (i < ls.length) {
        const l = ls[i];
        if (blank(l)) {
          let j = i; while (j < ls.length && blank(ls[j])) j++;
          if (j < ls.length && indentOf(ls[j]) > base && !(LI.test(ls[j]) && indentOf(ls[j]) <= base)) { for (; i < j; i++) body.push(""); loose = true; continue; }
          if (j < ls.length && LI.test(ls[j]) && indentOf(ls[j]) === base) loose = true;
          i = j; break;
        }
        if (indentOf(l) > base) { body.push(l.replace(new RegExp(`^ {0,${pad}}`), "")); i++; continue; }
        if (starts(ls, i)) break;
        if (blank(body[body.length - 1])) break;
        body.push(l); i++;
      }
      items.push(body);
      if (i < ls.length && blank(ls[i - 1]) && !(LI.test(ls[i]) && indentOf(ls[i]) === base)) break;
    }
    const start = ordered ? parseInt(m0[2], 10) : 1;
    const html = items.map(body => {
      let pre = "";
      const t = body[0].match(/^\[([ xX])\][ \t]+/);
      if (t) { pre = `<input type="checkbox" disabled${t[1] === " " ? "" : " checked"}> `; body[0] = body[0].slice(t[0].length); }
      return `<li${t ? ' class="task"' : ""}>${pre}${blocks(body, !loose)}</li>`;
    }).join("\n");
    const tag = ordered ? "ol" : "ul";
    return [`<${tag}${ordered && start !== 1 ? ` start="${start}"` : ""}>\n${html}\n</${tag}>`, i];
  }

  function blocks(ls, tight) {
    const out = []; let i = 0;
    while (i < ls.length) {
      const l = ls[i]; let m;
      if (blank(l)) { i++; continue; }
      if ((m = l.match(FENCE))) {
        const close = new RegExp(`^ {0,3}${m[1][0] === "`" ? "`" : "~"}{${m[1].length},}[ \\t]*$`), ind = indentOf(l), code = [];
        for (i++; i < ls.length && !close.test(ls[i]); i++) code.push(ls[i].replace(new RegExp(`^ {0,${ind}}`), ""));
        i++;
        out.push(`<pre><code${m[2] ? ` class="language-${esc(m[2])}"` : ""}>${esc(code.join("\n"))}</code></pre>`);
        continue;
      }
      if ((m = l.match(HEAD))) { const d = Math.min(m[1].length + 1, 6); out.push(`<h${d}>${inline(m[2] || "")}</h${d}>`); i++; continue; }
      if (HR.test(l)) { out.push("<hr>"); i++; continue; }
      if (QUOTE.test(l)) {
        const q = [];
        for (; i < ls.length && !blank(ls[i]) && (QUOTE.test(ls[i]) || !starts(ls, i)); i++) q.push(ls[i].replace(/^ {0,3}> ?/, ""));
        out.push(`<blockquote>\n${blocks(q)}\n</blockquote>`);
        continue;
      }
      if (LI.test(l) && !(LI.exec(l)[0].trim() === l.trim() && blank(ls[i + 1] || ""))) { const [h, j] = list(ls, i); out.push(h); i = j; continue; }
      if (isTable(ls, i)) {
        const head = cells(ls[i]), al = cells(ls[i + 1]).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : /^:-/.test(c) ? "left" : "");
        const td = (tag, c, k) => `<${tag}${al[k] ? ` style="text-align:${al[k]}"` : ""}>${inline(c)}</${tag}>`;
        const rows = [];
        for (i += 2; i < ls.length && !blank(ls[i]) && ls[i].includes("|"); i++) rows.push(cells(ls[i]));
        out.push(`<div class="table"><table>\n<thead><tr>${head.map((c, k) => td("th", c, k)).join("")}</tr></thead>\n<tbody>\n${rows.map(r => `<tr>${head.map((_, k) => td("td", r[k] || "", k)).join("")}</tr>`).join("\n")}\n</tbody></table></div>`);
        continue;
      }
      const para = [l.trim()];
      for (i++; i < ls.length && !blank(ls[i]); i++) {
        if ((m = ls[i].match(SETEXT))) break;
        if (starts(ls, i) && !(LI.test(ls[i]) && /^\d/.test(ls[i].trim()) && !/^1[.)]/.test(ls[i].trim()))) break;
        para.push(ls[i].trim());
      }
      if (i < ls.length && (m = ls[i].match(SETEXT))) { const d = m[1][0] === "=" ? 2 : 3; out.push(`<h${d}>${inline(para.join("\n"))}</h${d}>`); i++; continue; }
      out.push(tight ? inline(para.join("\n")) : `<p>${inline(para.join("\n"))}</p>`);
    }
    return out.join("\n");
  }

  const lines = String(src ?? "").replace(/\r\n?/g, "\n").replace(/^\t+/gm, t => "    ".repeat(t.length)).split("\n");
  return blocks(lines);
}
/* rhizome-md:end */

/* ===================== boot ===================== */
let savedTheme = null; try { savedTheme = localStorage.getItem("rhizome-theme"); } catch {}
setTheme(savedTheme !== "dark", false); // light by default; dark only if the viewer chose it
function boot() {
  G = buildGraph(DATA);
  $("#graph-empty").hidden = G.posts.length > 0;
  gPos = null;
  renderHud(); renderGallery();
  setView(st.view);
  initGraph();
}
if (typeof d3 === "undefined") {
  document.body.innerHTML = '<p style="padding:24px;font-family:monospace;color:#fffaf0">그래프 라이브러리를 불러오지 못했어요. 페이지를 새로고침해 주세요.</p>';
} else {
  Promise.all([document.fonts ? document.fonts.ready : null, loadLive()]).then(boot);
}
})();
